<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Zurück zu Finanzfrosch</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #ECECE9; color: #121211; font: 17px/1.4 -apple-system, system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #0E0E0D; color: #F3F2EE; } }
  main { padding: 28px; text-align: center; }
  a { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 999px;
      background: #E5684C; color: #121211; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<main>
  <p>Fertig bei der Bank. Du kommst zurück zu Finanzfrosch.</p>
  <a id="zurueck" href="finanzfrosch://bank">Zurück zu Finanzfrosch</a>
</main>
<script>
  // Reicht nur code und state an die App weiter. Nichts wird gespeichert oder gesendet.
  var ziel = "finanzfrosch://bank" + window.location.search;
  document.getElementById("zurueck").href = ziel;
  history.replaceState(null, "", window.location.pathname);
  window.location.replace(ziel);
</script>
</body>
</html>
